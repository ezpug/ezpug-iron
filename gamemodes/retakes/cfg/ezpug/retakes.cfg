// EZPug · retakes — exec'd by the core plugin when the match's map is up, before the flat
// cvars the manifest and the request derive (docs/gamemodes.md, "cfg").
//
// **This file is deliberately almost empty, and every line missing from it is missing on
// purpose.** cs2-retakes writes and execs its own `cfg/cs2-retakes/retakes.cfg` one second
// after the map starts (`ServerHelper.ExecuteRetakesConfiguration`, called from its
// `OnMapStart` timer) — thirty-odd cvars under the headings "things you shouldn't change"
// and "things you can change". That file is the mode: no halftime, no clinch, no economy,
// a one-second freeze time, `bot_kick; bot_quota 0`, `mp_maxrounds 30`. A stock vendor is
// a stock vendor (`plugins/vendor/README.md`), so nothing here restates any of it.
//
// **And it could not win anyway.** Our cfg lands on the loader's map hook — one second
// after the map started (`CounterStrikeWorld.MapReadyDelayMs`) — which is the same second
// retakes' own timer fires, so the two are a coin toss and a value set in both files is a
// value nobody decided. What must beat retakes' cfg goes in the manifest's `cvars`
// instead: those are a console frame later by construction
// (`GamemodeLoader.CvarSettleMs`, PRD-02 T22a), and that is why `bot_quota_mode` — the
// one cvar that decides whether bots fight at all (T21a) — is in `manifest.json` and not
// here. The request's own `bot_quota` and `mp_maxrounds` ride the same frame.
//
// What is left is the handful of things about the *server*, which retakes has no opinion
// about and which are the same for every EZPug mode.

// The server stays awake between rounds and between matches; the orchestrator decides
// when it is done, not an empty player list.
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 0

// Nobody votes anything on an EZPug server: the match is the client's to command over the
// Match API, and a vote to change the level mid-retake is a match that ends nowhere.
sv_allow_votes 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_changelevel_allowed 0

// Team sizes are the plugin's — its queue splits the players by `TerroristRatio` and
// refills the sides every round. The engine's own balancer would fight it.
mp_limitteams 0

// Warmup: the SDK's generic flow emitter ends it twenty seconds after the map is up and
// again every ten while the gamerules still say warmup (`GenericFlow.GoLiveDelayMs`,
// PRD-02 T22) — a `plugin` flow with an open join has no ready-up and nobody else to do
// it. Those twenty seconds are what the players and the request's bots arrive in. All
// this line does is make sure the timer underneath is not frozen; retakes sets it too,
// and agreeing with it costs nothing.
mp_warmup_pausetimer 0
