// EZPug · pug — exec'd by the core plugin when the match's map is up, before the flat
// cvars and before matchzy_loadmatch (docs/gamemodes.md, "cfg"). MatchZy owns the match:
// its own warmup.cfg / knife.cfg / live.cfg run at each phase, and the round format
// (mp_maxrounds, overtime) travels in the match config, which MatchZy re-applies after
// live.cfg. This file is only what a pug server needs beyond that.

// Nobody but the roster: MatchZy's whitelist is the match config's players.
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 0
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
sv_allow_votes 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_changelevel_allowed 0

// Bots only when a request asks (rules.cvars.bot_quota; PRD-02 T13 does).
//
// **The order of these two lines is load-bearing, and so is the mode.** The
// engine counts the GOTV client as one of the bots it may evict, and
// `bot_quota_mode` decides both whether it does and whether the bots play at
// all. Measured on the dev node against CS2 1.41.7.8 (PRD-02 T21a, one command
// per boot, the server's own `logs/*.log` read back):
//
//   bot_quota_mode  a bot_quota that drops   the bots
//   competitive     GOTV survives            never fire a shot: 7 rounds, 0
//                                            kills, 0 damage, every round to
//                                            the CTs on the clock
//   normal          GOTV is kicked           play properly
//   fill            everything is kicked     play properly
//                   and refilled
//
// A *rising* quota evicts nobody in any mode, and a drop with no bots standing
// is not a change at all — the eviction is one pass at the end of the frame,
// over whatever the console left behind. A whole cfg is one such frame, which
// is why `bot_kick` leads: the map arrives with two bots of its own
// (`gamemode_competitive.cfg` sets `bot_quota 1`), and dropping the quota and
// switching the mode above them evicts GOTV with them — measured, this exact
// file, one line short of this one. `bot_kick` empties the server inside the
// frame, so the pass that follows has nothing to evict; MatchZy's own
// `warmup.cfg` opens the same way and for the same reason.
//
// From there only the match moves the quota, and only upwards. MatchZy's
// `live.cfg` opens with `bot_quota 0`, which is why `scripts/iron-match.mjs`
// empties the server before it starts a match and asks for its bots once the
// match is live: a drop that drops nothing cannot take GOTV with it, and CS2
// does not bring SourceTV back without a level change.
bot_kick
bot_quota 0
bot_quota_mode normal
bot_join_after_player 0

// GOTV. `tv_enable` only takes effect at a level change, so the value that
// matters is the one on the launch line (`docker/cs2/entrypoint.sh`) — this is
// the rest of the settings and a restatement for a server that was started by
// hand. The delay is what the core plugin waits out before it stops recording
// (`DemoFlow`, PRD-02 T21): GOTV records the *delayed* broadcast.
tv_enable 1
tv_delay 105
tv_autorecord 0
tv_transmitall 1

// Recording is MatchZy's on going live (matchzy_demo_recording_enabled), the upload is
// the core plugin's (decision 10, PRD-02 T21).
