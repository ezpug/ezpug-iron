// MultiAddonManager on an EZPug server (PRD-07 T2, docs/hud.md). The plugin reads this
// file once, when Metamod loads it at boot, which happens only on a server with
// EZPUG_HUD_ADDON. Every line is sent to the server console as it stands.
//
// No addon for anyone yet: the HUD's id joins the client list when a match asks for the
// HUD (mm_add_client_addon at assign) and leaves it at release. A server is not asked to
// mount anything itself.
mm_extra_addons ""
mm_client_extra_addons ""
mm_extra_addons_timeout 10
mm_addon_mount_download 0
// The client is kicked if it comes back still mid-download after 30 s. docs/hud.md,
// "When the download cannot finish", says what that means for a player.
mm_addon_connection_timeout 30
// Remember who has the addon, for the life of the server, so a map change or a rejoin
// does not send the same player through the download handshake again.
mm_cache_clients_with_addons 1
mm_cache_clients_duration 0
// Leave the disconnect event alone. Blocking it hides every "loop shutdown" disconnect
// from MatchZy, CounterStrikeSharp's plugins and our own vocabulary. That reason is the
// addon's reconnect as far as anybody knows, but not provably only that. The HUD is
// decoration and must not change what a server says happened. The price is one
// "left the game" chat line per player on a first join.
mm_block_disconnect_messages 0
mm_addon_debug 0
