// EZPug · powerup-dm — exec'd by the core plugin when the match's map is up, before the
// flat cvars the manifest and the request derive (docs/gamemodes.md, "cfg").
//
// The mode is two halves: this file is the *deathmatch*, and `EZPug.PowerupDm` — a class
// over `EZPug.Sdk` — is the *power-up*. Neither half knows much about the other: the
// plugin never touches a cvar the engine already decides, and nothing here knows that a
// phone exists. `docs/sdk.md` shows the class; `gamemodes/powerup-dm/widget/` is the
// button that fires it.
//
// **Free-for-all, not a team game.** The manifest asks for one team and open join
// (`slots.teams: 1`, `openJoin: true`) and carries the four cvars that make the engine
// agree — `mp_teammates_are_enemies`, the two `mp_respawn_on_death_*` and
// `mp_respawn_immunitytime`. They live in `manifest.json` rather than here for the reason
// `gamemodes/retakes/cfg/ezpug/retakes.cfg` spells out: a manifest's cvars land a console
// frame *after* this file (`GamemodeLoader.CvarSettleMs`, PRD-02 T22a), so anything that
// must survive whatever the engine execs at map load belongs there, not here.

// **The next map's defaults, not this one's.** The engine reads `game_type`/`game_mode`
// at level init and execs the matching `gamemode_*.cfg` there, so these decide what a
// *later* map loads with — deathmatch, which is the closest stock flavour to this mode
// and the only one whose own defaults do not have to be undone below. Everything this map
// needs is set explicitly anyway.
game_type 1
game_mode 2

// **Bots fight only in `normal` mode.** `gamemode_competitive.cfg` leaves
// `bot_quota_mode competitive` behind at every map load and competitive bots do not
// engage at all (measured in PRD-02 T21a: ten of them, seven rounds, zero kills). The
// *count* is the request's `bot_quota`, set a frame after this file — which is also why
// there is no `bot_kick` here (T22a: a kick and a quota in one frame net out to nothing).
bot_quota_mode normal
bot_join_after_player 0

// ── The deathmatch ─────────────────────────────────────────────────────────
// **One round, and the manifest says how long the match is** (PRD-03 T9): `length` —
// ten minutes from `going_live`, or five with nobody on the server — is enforced by the
// SDK (`MatchLength`), which ends the match with a `map_end` and a `series_end` that carry
// the reason, and the orchestrator releases the box. The engine's own clocks are
// therefore set *out of the way* rather than to the same ten minutes: `mp_timelimit`
// counts from the map load and the SDK counts from going live, so two equal clocks meant
// the engine won by the length of the warmup, the phone's countdown stopped at 0:20 and
// the end carried no reason. `mp_roundtime 60` is the most the engine allows, so the one
// round outlasts any length up to an hour; past that a round simply ends on time and the
// next one starts. Everybody respawns, so no round is going to end by elimination.
//
// **There is deliberately no `mp_ignore_round_win_conditions 1` here, and that is a
// measurement.** It was in this file for the first run on the dev node (PRD-02 T26) and
// it works exactly as advertised: no round can be won — and the engine evaluates
// `mp_timelimit` in the same pass, so no *map* can end either. Eight bots played 1180
// deaths on `de_mirage` and the match had to be force-ended by the client at twelve
// minutes with one `round_start` and no `round_end` in the log. A mode that cannot
// finish itself is not a mode.
//
// A request that carries `rules` sets `mp_maxrounds` over the line below from
// `regulationRounds` (`match-config/cvars.ts`: the rules are the last word). That is the
// client's to decide and costs this mode nothing — a round that outlasts the match
// means the mode's length still runs out first. The win panel stays a working end: a
// request whose own `rules.cvars` bring `mp_timelimit` back is told `map_end` by the
// generic flow emitter as before, without a reason.
mp_timelimit 0
mp_maxrounds 0
mp_halftime 0
mp_match_can_clinch 0
mp_freezetime 0
mp_roundtime 60
mp_roundtime_defuse 60
mp_roundtime_hostage 60

// Nothing to plant, nobody to rescue: the objective would end the round the clock owns.
mp_give_player_c4 0
mp_defuser_allocation 0
mp_weapons_allow_map_placed 0

// **Everybody buys, all the time.** The power-up is the only advantage this mode hands
// out on purpose; the gun is the player's own choice and the money is never the reason
// somebody loses. `mp_buy_anywhere` is in the manifest, beside the respawn cvars.
mp_startmoney 16000
mp_maxmoney 16000
mp_buytime 60000
mp_afterroundmoney 16000
mp_free_armor 0
mp_death_drop_gun 1
mp_death_drop_grenade 0
mp_death_drop_defuser 0

// The mode gives armour as a power-up, so the round can never start with it; the speed
// power-up is a multiplier over `sv_maxspeed`, which stays stock so that "1.0" means what
// a player is used to.
mp_playercashawards 0
mp_teamcashawards 0

// ── The server ─────────────────────────────────────────────────────────────
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 0
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
sv_allow_votes 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_changelevel_allowed 0

// ── Warmup ─────────────────────────────────────────────────────────────────
// A `plugin` flow with an open join has no ready-up and nobody to end the warmup, and
// CS2's own warmup timer does not run down on a dedicated server (measured against
// 1.41.7.8 — the note in `gamemodes/flying-scoutsman/cfg/ezpug/flying-scoutsman.cfg`
// carries the numbers). The SDK's generic flow emitter ends it twenty seconds after the
// map is up and again every ten while the gamerules still say warmup
// (`GenericFlow.GoLiveDelayMs`, PRD-02 T22); those twenty seconds are what the players
// and the request's bots arrive in. All this line does is keep the timer underneath
// unfrozen.
mp_warmup_pausetimer 0
