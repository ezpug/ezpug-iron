packages:
  - apps/*
  - packages/*
  # The C# side is one workspace package: `plugins/package.json` wraps
  # `dotnet build` and `dotnet test` over `plugins/EZPug.sln` so Turbo runs
  # them as `typecheck` and `test` beside the TypeScript packages.
  - plugins
  - gamemode-kit
  # The manifests, as data (`@ezpug/gamemodes`), so the package that bundles
  # them and the apps that read them share one source.
  - gamemodes

# Dependencies whose install scripts are allowed to run (pnpm 10 blocks all
# build scripts by default).
onlyBuiltDependencies:
  - esbuild

# Shared version pins — packages reference these with "catalog:" so the whole
# workspace stays on one version per tool. Mirrors the platform's catalog on
# 2026-09-05: the published package must resolve against the same zod the
# platform installs.
catalog:
  typescript: ~5.9.3
  vitest: ^4.1.11
  zod: ^4.4.3
  tsdown: ^0.22.14
  "@types/node": ^22.18.0
  # The fake orchestrator (`@ezpug/match-api/fake`) is a Hono app; `listen()`
  # serves it over Node HTTP with the stream as a `ws` upgrade (PRD-01 T6).
  hono: ^4.13.3
  "@hono/node-server": ^2.1.1
  ws: ^8.18.0
  "@types/ws": ^8.18.1
