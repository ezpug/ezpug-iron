// EZPug · pug — exec'd by the core plugin when the match's map is up, before the flat
// cvars and before matchzy_loadmatch (docs/gamemodes.md, "cfg"). MatchZy owns the match:
// its own warmup.cfg / knife.cfg / live.cfg run at each phase, and the round format
// (mp_maxrounds, overtime) travels in the match config, which MatchZy re-applies after
// live.cfg. This file is only what a pug server needs beyond that.

// Nobody but the roster: MatchZy's whitelist is the match config's players.
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 0
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
sv_allow_votes 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_changelevel_allowed 0

// Bots only when a request asks (rules.cvars.bot_quota; PRD-02 T13 does).
bot_quota 0
bot_quota_mode fill
bot_join_after_player 0

// GOTV, **after the bot lines and not before them**: the engine counts the SourceTV
// client as a bot, so a `bot_quota 0` above it takes GOTV with it
// (`SourceTV kicked by Console`, seen on the dev node, PRD-02 T21) and the map's demo is
// then never written. This order keeps *our* cfg out of that; MatchZy's own
// `warmup.cfg` and `live.cfg` run `bot_quota 0` too, and bringing GOTV back after them
// needs more than a cvar — which is why a bots match on this box still records nothing
// and why that is its own task.
tv_enable 1
tv_delay 105
tv_autorecord 0
tv_transmitall 1

// Recording is MatchZy's on going live (matchzy_demo_recording_enabled), the upload is
// the core plugin's (decision 10, PRD-02 T21).
