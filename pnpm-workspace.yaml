packages:
  - apps/*
  - packages/*
  # The C# side is one workspace package: `plugins/package.json` wraps
  # `dotnet build` and `dotnet test` over `plugins/EZPug.sln` so Turbo runs
  # them as `typecheck` and `test` beside the TypeScript packages.
  - plugins
  - gamemode-kit
  # The manifests, as data (`@ezpug/gamemodes`), so the package that bundles
  # them and the apps that read them share one source.
  - gamemodes

# Dependencies whose install scripts are allowed to run (pnpm 10 blocks all
# build scripts by default).
onlyBuiltDependencies:
  - esbuild

# Shared version pins — packages reference these with "catalog:" so the whole
# workspace stays on one version per tool. Mirrors the platform's catalog on
# 2026-09-05: the published package must resolve against the same zod the
# platform installs.
catalog:
  typescript: ~5.9.3
  vitest: ^4.1.11
  zod: ^4.4.3
  tsdown: ^0.22.14
  "@types/node": ^22.18.0
  # The fake orchestrator (`@ezpug/match-api/fake`) is a Hono app; `listen()`
  # serves it over Node HTTP with the stream as a `ws` upgrade (PRD-01 T6).
  hono: ^4.13.3
  "@hono/node-server": ^2.1.1
  ws: ^8.18.0
  "@types/ws": ^8.18.1
  # The orchestrator's rails (PRD-02 T2), on the platform's versions so a
  # migration or a Redis idiom ported from `/root/ezpug` behaves the same.
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  postgres: ^3.4.9
  ioredis: ^5.9.0
  tsx: ^4.23.12
  # The node agent's docker client (PRD-02 T11): dockerode 4 with the typings
  # of the same major. 5.x adds a BuildKit client and the gRPC stack behind it;
  # the agent only creates, starts, stops and lists containers.
  dockerode: ^4.0.12
  "@types/dockerode": ^4.0.1
  # The fake Dathost's own proof (PRD-02 T15): every response it writes is
  # validated against `references/dathost/openapi.merged.json` in a test, and a
  # hand-rolled schema walker would be a second thing to trust. Test-only —
  # nothing the orchestrator ships imports it.
  ajv: ^8.17.1
  # The widget toolchain (PRD-02 T25, `gamemode-kit/`): a gamemode's phone
  # widget is a Vue custom element built by Vite in library mode. The platform's
  # versions (its `packages/ui` runs the same Vue and the same Vite), so a
  # widget and the page that frames it agree on the runtime. `happy-dom` is the
  # kit's test DOM only.
  vue: ^3.5.41
  vue-tsc: ^3.3.11
  vite: ^8.2.2
  "@vitejs/plugin-vue": ^6.0.8
  happy-dom: ^20.11.6
