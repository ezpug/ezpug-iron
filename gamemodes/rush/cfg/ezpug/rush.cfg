// EZPug · rush — exec'd by the core plugin when the match's map is up, before the flat
// cvars the manifest names (docs/gamemodes.md, "cfg"). A `config` tier mode: no plugin,
// and the SDK's generic flow tells the story from the engine's events.
//
// **The rules are not in here, and not in any plugin.** Rush is a `cs_script` on the map
// (`maps/scripts/rush_001.vjs`): every live round it sets `mp_ignore_round_win_conditions
// 1`, decides the round itself (the tower's owner wins) with `FireWinCondition`, pays
// $2500 with `AddTeamMoney`, moves the spawns and the tower one room along the line, and
// ends the match early by setting `mp_maxrounds` to the rounds played. So this file only
// puts the server in the state Valve's own queue would, and gets out of the way.

// **The engine game: `game_type 0`, `game_mode 6`.** Read off the node's own
// `gamemodes.txt` (inside `pak01_dir.vpk`, CS2 1.41.8.2): Rush is mode `6` of the
// `classic` type, `maxplayers 6`, exec `gamemode_rush.cfg`, map group `mg_rush_001`, and
// `rush_001`'s own entry says `default_game_type 0` / `default_game_mode 6`. The engine
// reads both at level init, so here — after the map is up — they only restate what the map
// was loaded under: the core plugin's loader sets them in the frame that changes level to a
// tower map (PRD-06 T3). Measured on the dev node before it did, `rush_001` loaded as `0`/`1`
// and the script played its rounds all the same (40 s, the holder winning on the clock), but
// `going_live` called the match competitive.
game_type 0
game_mode 6

// **The mode, as Valve wrote it.** `gamemode_rush.cfg` ships with the game and stays
// there: round times, `mp_freezetime 13`, `mp_buytime 15`, $800 start, $10000 cap, the
// $2100 loser bonus, `mp_halftime 0`, one grenade, `mp_maxrounds 15`, the Rush bot tree
// and `mp_team_intro_type rush`. Execing it rather than copying it keeps the mode what the
// game's current build says it is.
exec gamemode_rush.cfg

// **Bots: none of the engine's.** `gamemode_rush.cfg` asks for `bot_quota 2` under
// `bot_quota_mode fill`, which is the matchmaking queue topping a short team up. A match
// here seats six people (or puppets in their places), so the manifest sets `bot_quota 0`
// a frame after this file. `normal` is pinned here because `fill` counts people against
// the quota: the SDK's puppeteer raises `bot_quota` by one per puppet it adds, and under
// `fill` every person who joins a mixed roster would send one puppet home.
bot_quota_mode normal
bot_join_after_player 0

// ── The server ─────────────────────────────────────────────────────────────
// The engine's cfg turns votes on; a match here has an orchestrator for that.
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 0
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
sv_allow_votes 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_changelevel_allowed 0

// ── Warmup ─────────────────────────────────────────────────────────────────
// As for every `config` mode, the SDK's generic flow ends the warmup itself
// (`GenericFlow.GoLiveDelayMs`), because CS2's warmup timer does not run down on a
// dedicated server. All this file does is make sure the timer is not frozen underneath it.
mp_warmup_pausetimer 0
