
// ============================================================================
// EZPUG IRON — appended to the pinned release's own config.cfg by the image
// build (docker/cs2/Dockerfile), so it is read last and wins. docs/decisions.md
// 19 says why each line is here; docker/cs2/matchzy-cfg-check.sh is the list of
// what may never be on, and the build runs it over the file as it ships.
// ============================================================================

// A server of ours dials one place, the orchestrator (CLAUDE.md, "every server
// dials out"). MatchZy-Enhanced asks Steam's UpToDateCheck every five minutes
// unless told not to — its code default is true and its own config.cfg never
// mentions it. `restart` would also kick everybody and quit the server; the
// game is updated by the image and the node, never by a plugin.
matchzy_safeautoupdater_enabled false
matchzy_safeautoupdater_action "warn_only"

// Spawns two bots into warmup to demonstrate auto-ready. Puppets come from a
// match request that asks for them (PRD-03 T4), never from a cfg.
matchzy_autoready_simulation_enabled false

// The match report upload posts the whole match to whatever the first names,
// as the server the second names. Empty is off, and is written here so that
// no upstream default can turn it on.
matchzy_report_endpoint ""
matchzy_report_server_id ""
matchzy_report_token ""

// ---------------------------------------------------------------------------
// What a real match turns on (PRD-03 T3a, owner decision 2026-09-19). These
// are the fork's *player* features, not a path it opens: they decide what the
// people on the server can do to the match, and the two below exist because a
// server that waits for nobody bills until a human notices.
// ---------------------------------------------------------------------------

// **A knife round nobody answers ends by itself.** Stock MatchZy waits for the
// winner to type `.stay` or `.switch` and waits for ever; the fork runs a
// timer and picks a side at random when it expires (`Utility.cs`
// StartAfterKnifeWarmup). Sixty seconds is upstream's own number and long
// enough for somebody reading their phone. This is the server's rule and not a
// request's: no client may build a match that can hold a box for ever.
matchzy_side_selection_enabled true
matchzy_side_selection_time 60

// **`.gg` and the forfeit clock stay off.** Both end a match early — a
// surrender vote and a walkover when a team leaves — and the Match API has no
// result that says either, so a server using one would end a match the
// platform cannot record. The day there is a forfeit result they can be
// reconsidered, together.
matchzy_gg_enabled false
matchzy_ffw_enabled false

// **Auto-ready is the match's call, not the server's.** The builder writes
// `matchzy_autoready_enabled` into every match config from the request's
// `rules.warmup.autoReady` (default on), and MatchZy applies the config's
// cvars before warmup and puts them back at series end — so a LAN admin who
// wants the room to type `.ready` asks for it per match. The baseline here is
// off, so a server between matches readies nobody. The countdown length is the
// server's, because it is a spectacle and not a rule.
matchzy_autoready_enabled false
matchzy_autoready_start_delay 5

// **The verbose console stays on, and it is load-bearing** (PRD-03 T7a).
// Simulation mode maps each bot it spawns onto a roster entry and keeps that
// mapping in a private dictionary; the only place it says which bot plays whom
// is this console (`SimulationMode.cs`, "Assigned bot … to simulated player
// …"). CounterStrikeSharp runs both plugins in one process, so the core plugin
// reads those lines off `Console.Out` and casts the bodies from them — which is
// what lets a puppet be announced, found by a `kick` and named in its own
// deaths. Turned off, a room of puppets goes back to being ten anonymous bots.
// It is upstream's default; it is written here so no release can change that.
matchzy_debug_console true
