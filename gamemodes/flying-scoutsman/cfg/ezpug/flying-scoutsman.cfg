// EZPug · flying-scoutsman — exec'd by the core plugin when the match's map is up,
// before the flat cvars the request and the rules derive (docs/gamemodes.md, "cfg").
// This is the whole mode: a `config` tier manifest names no plugin, so nothing but
// these lines and the SDK's generic flow emitter (PRD-02 T22) stands between a stock
// CS2 server and a complete match story.
//
// **There is no Valve file to copy.** CS2 ships `gamemode_casual.cfg`,
// `gamemode_competitive.cfg` and the rest, but nothing for Flying Scoutsman: the mode
// lives in matchmaking and the string `scoutsknives` appears nowhere in the install
// (checked against CS2 1.41.7.8 — `libserver.so`, `pak01_dir.vpk` and the whole `cfg/`
// set). So the mode is written out here, cvar by cvar, and every name below was checked
// against `libserver.so` before it was written down.

// **The next map's defaults, not this one's.** The engine reads `game_type`/`game_mode`
// at level init and execs the matching `gamemode_*.cfg` there — which is precisely why
// the loader waits for the map before it execs this file (plugins/README.md). Setting
// them here therefore decides what a *later* map loads with, and casual is the right
// flavour for a scout duel: no buying, free armour, no economy. Everything this map
// needs is set explicitly below, so the mode plays the same either way.
game_type 0
game_mode 0

// **Bots: the mode, and nothing else.** Under `bot_quota_mode competitive` — the mode
// `gamemode_competitive.cfg` leaves behind at every map load — bots do not fight at all
// (measured in PRD-02 T21a: ten of them, seven rounds, zero kills). `normal` bots play
// properly, so the mode is switched here and the *count* is left to the request's
// `bot_quota`, which the loader sets right after this file.
//
// **This file deliberately does not `bot_kick`, and that is a measurement too.** The
// engine acts on `bot_quota` when the value *changes*, once at the end of the console
// frame it was set in — so a `bot_kick; bot_quota 0` here and the request's `bot_quota 10`
// in the same frame net out to no change at all, and the server that was emptied stays
// empty. A whole match ran that way before the loader was fixed: ten bots kicked at
// 1.19 s, `going_live` at 21 s and not one player in it. The loader now gives this file a
// frame of its own and the assignment's cvars the next (`GamemodeLoader.CvarSettleMs`,
// PRD-02 T22a), so a `bot_kick` here would be honest again — it is still not written,
// because there is nothing here to protect: `ezpug/pug.cfg` opens with one to keep the
// eviction pass off GOTV, and a mode that records `events` has no demo to lose.
bot_quota_mode normal
bot_join_after_player 0

// ── The mode ───────────────────────────────────────────────────────────────
// A scout, a knife, and a fifth of the gravity. Nothing to buy, nothing to pick up,
// nothing to plant: every round is a duel that ends by elimination or on the clock.
mp_ct_default_primary weapon_ssg08
mp_t_default_primary weapon_ssg08
mp_ct_default_secondary ""
mp_t_default_secondary ""
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_ct_default_grenades ""
mp_t_default_grenades ""
mp_free_armor 2
mp_weapons_allow_zeus 0
sv_gravity 200

// No economy: a buy menu with no money in it is a menu nobody opens.
mp_buytime 0
mp_buy_anywhere 0
mp_startmoney 0
mp_maxmoney 0
mp_playercashawards 0
mp_teamcashawards 0

// Nothing on the ground and nothing to plant, so the scout stays the only gun.
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0
mp_weapons_allow_map_placed 0
mp_give_player_c4 0
mp_defuser_allocation 0

// ── The match ──────────────────────────────────────────────────────────────
// The round format itself is the request's: `mp_maxrounds` and the overtime cvars are
// derived from `rules.regulationRounds` and set after this file (`match-config/cvars.ts`),
// so a client decides the length and the mode decides the shape.
//
// **Halftime stays on.** The generic flow emitter follows the swap off the gamerules and
// emits `side_swap`, which is what keeps a score in team order rather than in side order
// once the teams have changed ends; switching halftime off here would hide the one part
// of the story a config mode is most likely to get wrong.
mp_halftime 1
mp_match_can_clinch 1
mp_timelimit 0
mp_freezetime 5
mp_roundtime 2
mp_roundtime_defuse 2
mp_roundtime_hostage 2

// ── The server ─────────────────────────────────────────────────────────────
sv_hibernate_when_empty 0
sv_hibernate_postgame_delay 0
mp_autokick 0
mp_autoteambalance 0
mp_limitteams 0
sv_allow_votes 0
sv_vote_issue_kick_allowed 0
sv_vote_issue_changelevel_allowed 0

// ── Warmup ─────────────────────────────────────────────────────────────────
// **Nothing here ends it, and that is deliberate.** A `matchzy` mode has MatchZy to hold
// the warmup open and end it on `.ready`; a `config` mode has nobody — and CS2's own
// warmup timer does not run down on a dedicated server (measured on this box against
// 1.41.7.8 with ten bots standing: a warmup restarted on `mp_warmuptime 20`, with
// `mp_warmup_pausetimer 0` and both `mp_warmup_online_enabled` and
// `mp_warmup_offline_enabled` at 1, was still the warmup period 72 seconds later). A
// `mp_warmup_end` *here* does not work either: one second into the map the engine
// re-enters warmup right after it, which cost a whole match — twenty minutes of warmup and
// an honest `ttl_expired`.
//
// So the SDK's generic flow emitter ends it, twenty seconds after the map is up and again
// every ten while the gamerules still say warmup (`GenericFlow.GoLiveDelayMs`, PRD-02
// T22). Those twenty seconds are what the request's bots and the roster arrive in; the
// round that follows is `going_live`. All this file does is make sure the timer is not
// frozen underneath it.
mp_warmup_pausetimer 0
